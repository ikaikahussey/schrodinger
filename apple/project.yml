# Generate with: brew install xcodegen && cd apple && xcodegen generate && open Schrodinger.xcodeproj
name: Schrodinger
options:
  bundleIdPrefix: org.schrodinger
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "3D52FT6PP7"
targets:
  Schrodinger:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: Schrodinger
    info:
      path: Schrodinger/Resources/Info.plist
      properties:
        CFBundleDisplayName: Schrodinger
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCalendarsFullAccessUsageDescription: "Schrodinger reads your calendar to show upcoming events alongside tasks and lets you add tasks to your calendar."
        BGTaskSchedulerPermittedIdentifiers: ["org.schrodinger.harness"]
        UIBackgroundModes: ["fetch", "processing", "remote-notification"]
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    # One entitlements file per platform: push (which CloudKit uses to tell a device that another one changed
    # something) has a different key on each. Export for the App Store switches both to production.
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Schrodinger/Resources/Schrodinger-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Schrodinger/Resources/Schrodinger-macOS.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: org.schrodinger.app
        ENABLE_PREVIEWS: YES
  SchrodingerTests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    sources: [SchrodingerTests]
    dependencies:
      - target: Schrodinger_${platform}
schemes:
  Schrodinger_macOS:
    build: { targets: { Schrodinger_macOS: all, SchrodingerTests_macOS: [test] } }
    run: { config: Debug }
    test: { config: Debug, targets: [SchrodingerTests_macOS] }
    archive: { config: Release }
  Schrodinger_iOS:
    build: { targets: { Schrodinger_iOS: all, SchrodingerTests_iOS: [test] } }
    run: { config: Debug }
    test: { config: Debug, targets: [SchrodingerTests_iOS] }
    archive: { config: Release }
