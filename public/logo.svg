<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="l"><rect x="0" y="0" width="32" height="64"/></clipPath>
    <clipPath id="r"><rect x="32" y="0" width="32" height="64"/></clipPath>
    <!-- cat head: ears + face -->
    <path id="cat" d="M14 30 L12 10 L26 20 L38 20 L52 10 L50 30 Q56 40 50 50 Q40 60 32 60 Q24 60 14 50 Q8 40 14 30 Z"/>
  </defs>
  <!-- left half solid -->
  <use href="#cat" fill="#1c1917" clip-path="url(#l)"/>
  <!-- right half outline only (the "other" state) -->
  <use href="#cat" fill="none" stroke="#1c1917" stroke-width="3" stroke-linejoin="round" clip-path="url(#r)"/>
  <!-- eyes: left open (light on dark), right closed (dark line) -->
  <ellipse cx="23" cy="38" rx="3.2" ry="4" fill="#fafaf9"/>
  <circle cx="23" cy="38" r="1.3" fill="#1c1917"/>
  <path d="M37 38 Q41 41 45 38" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/>
  <!-- nose + whiskers -->
  <path d="M30 46 L34 46 L32 49 Z" fill="#fafaf9" clip-path="url(#l)"/>
  <path d="M30 46 L34 46 L32 49 Z" fill="#1c1917" clip-path="url(#r)"/>
  <g stroke-width="1.6" stroke-linecap="round">
    <path d="M22 47 L10 45 M22 50 L11 52" stroke="#fafaf9"/>
    <path d="M42 47 L54 45 M42 50 L53 52" stroke="#1c1917"/>
  </g>
</svg>
